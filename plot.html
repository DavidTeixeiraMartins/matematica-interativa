<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Matemática Interativa | Gráficos</title>

    <link rel="stylesheet" href="css/geral.css">
    <link rel="stylesheet" href="css/plot.css">
</head>

<body> 

    <div class="entrada-funcao">
    <input
        type="text"
        id="funcao"
        placeholder="Digite uma função, por exemplo: x^2 - 2">
    <button id="gerar">Gerar</button>
    </div>

<div class="area-grafico">
    <svg id="grafico" viewBox="0 0 800 500"
         xmlns="http://www.w3.org/2000/svg">

        <g transform="translate(400, 250)">
            <!-- Eixos -->
            
            <line x1="-400" y1="0" x2="400" y2="0" stroke="#1a1a1a" stroke-width="0.8" />
            <line x1="0" y1="-250" x2="0" y2="250" stroke="#1a1a1a" stroke-width="0.8" />
            
            <!-- Marcações no eixo x -->
            <g stroke="#64748b" stroke-width="1">
                <path d="
                M -400 -4 V 4
                M -350 -4 V 4
                M -300 -4 V 4
                M -250 -4 V 4
                M -200 -4 V 4
                M -150 -4 V 4
                M -100 -4 V 4
                M -50  -4 V 4
                M  50  -4 V 4
                M  100 -4 V 4
                M  150 -4 V 4
                M  200 -4 V 4
                M  250 -4 V 4
                M  300 -4 V 4
                M  350 -4 V 4
                M  400 -4 V 4
                " />
            </g>
            
            <!-- Marcações no eixo y -->
            <g stroke="#64748b" stroke-width="1">
                <path d="
                M -4 -250 H 4
                M -4 -200 H 4
                M -4 -150 H 4
                M -4 -100 H 4
                M -4 -50  H 4
                M -4  50  H 4
                M -4  100 H 4
                M -4  150 H 4
                M -4  200 H 4
                M -4  250 H 4
                " />
            </g>

            <!-- Números do eixo x -->
            <text x="-350"  y="20" text-anchor="middle">-7</text>
            <text x="-300"  y="20" text-anchor="middle">-6</text>
            <text x="-250"  y="20" text-anchor="middle">-5</text>
            <text x="-200"  y="20" text-anchor="middle">-4</text>
            <text x="-150"  y="20" text-anchor="middle">-3</text>
            <text x="-100"  y="20" text-anchor="middle">-2</text>
            <text x="-50"   y="20" text-anchor="middle">-1</text>
            <text x="50"    y="20" text-anchor="middle" font-size="10">1</text>
            <text x="100"   y="20" text-anchor="middle" font-size="10">2</text>
            <text x="150"   y="20" text-anchor="middle" font-size="10">3</text>
            <text x="200"   y="20" text-anchor="middle" font-size="10">4</text>
            <text x="250"   y="20" text-anchor="middle" font-size="10">5</text>
            <text x="300"   y="20" text-anchor="middle" font-size="10">6</text>
            <text x="350"   y="20" text-anchor="middle" font-size="10">7</text>

            <!-- Números do eixo y -->
            <text x="-15" y="-200" text-anchor="end" dominant-baseline="middle">4</text>
            <text x="-15" y="-150" text-anchor="end" dominant-baseline="middle">3</text>
            <text x="-15" y="-100" text-anchor="end" dominant-baseline="middle">2</text>
            <text x="-15" y="-50"  text-anchor="end" dominant-baseline="middle">1</text>
            <text x="-15" y="50"   text-anchor="end" dominant-baseline="middle">-1</text>
            <text x="-15" y="100"  text-anchor="end" dominant-baseline="middle">-2</text>
            <text x="-15" y="150"  text-anchor="end" dominant-baseline="middle">-3</text>
            <text x="-15" y="200"  text-anchor="end" dominant-baseline="middle">-4</text>
        </g>
    </svg>
</div>

<script src="https://cdn.jsdelivr.net/npm/mathjs@14.8.1/lib/browser/math.js"></script>
<script src="js/plot.js"></script>
