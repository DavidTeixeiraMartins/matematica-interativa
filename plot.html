<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Matemática Interativa | Gráficos</title>

    <link rel="stylesheet" href="css/geral.css">
    <link rel="stylesheet" href="css/plot.css">
</head>

<body>

    <h1>Gráficos</h1>

    <div class="entrada-funcao">
    <input
        type="text"
        id="funcao"
        placeholder="Digite uma função, por exemplo: x^2 - 2">
    <button id="gerar">Gerar</button>
    </div>

<div class="area-grafico">
    <svg id="grafico" viewBox="0 0 800 500"
         xmlns="http://www.w3.org/2000/svg">

        <g transform="translate(400, 250)">
            <!-- Eixos -->
            
            <line x1="-400" y1="0" x2="400" y2="0" stroke="#1a1a1a" stroke-width="0.8" />
            <line x1="0" y1="-250" x2="0" y2="250" stroke="#1a1a1a" stroke-width="0.8" />
            <!-- Marcações no eixo x -->
            <g stroke="#64748b" stroke-width="1">
                <path d="
                M -300 -5 V 5
                M -270 -5 V 5
                M -240 -5 V 5
                " />
            </g>

            <!-- Números do eixo x -->
        </g>
    </svg>
</div>

<script src="https://cdn.jsdelivr.net/npm/mathjs@14.8.1/lib/browser/math.js"></script>
<script src="js/plot.js"></script>
