
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerador de Gráficos</title>

    <link rel="stylesheet" href="css/estilo.css">
</head>

<body>

    <h1>Gerador de Gráficos</h1>

    <div class="entrada-funcao">
    <input
        type="text"
        id="funcao"
        placeholder="Digite uma função, por exemplo: x^2 - 2"
    >
    <button id="gerar">Gerar</button>
    </div>

    <div class="area-grafico">
        <svg id="grafico" viewBox="0 0 800 500"
             xmlns="http://www.w3.org/2000/svg">
        </svg>
    </div>

</body>

</html>
