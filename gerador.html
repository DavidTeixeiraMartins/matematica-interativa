
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerador de Gráficos</title>

    <link rel="stylesheet" href="css/estilo.css">
</head>

<body>

    <h1>Gerador de Gráficos</h1>

    <div class="entrada-funcao">
    <input
        type="text"
        id="funcao"
        placeholder="Digite uma função, por exemplo: x^2 - 2"
    >
    <button id="gerar">Gerar</button>
    </div>

    <div class="area-grafico">
        <svg id="grafico" viewBox="0 0 800 500"
             xmlns="http://www.w3.org/2000/svg">
        </svg>
    </div>

    <g transform="translate(400, 250)">

    <!-- Eixo horizontal -->
    <line x1="-350" y1="0" x2="350" y2="0"
          stroke="black" stroke-width="2" />

    <!-- Eixo vertical -->
    <line x1="0" y1="-220" x2="0" y2="220"
          stroke="black" stroke-width="2" />

    </g>

</body>

</html>
